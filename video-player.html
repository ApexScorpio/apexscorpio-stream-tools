<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Stream Tools — Video Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #eee;
      font: 16px system-ui;
    }

    body {
      display: grid;
      grid-template-rows: clamp(54px, 12.5vw, 240px) auto;
      align-content: start;
    }

    .title-band {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0 clamp(12px, 4vw, 56px);
    }

    #video-title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      margin: 0;
      color: #fff;
      text-align: center;
      font-size: clamp(16px, 4vw, 56px);
      line-height: 1.15;
      font-weight: 700;
    }

    .video-stage {
      position: relative;
      aspect-ratio: 16 / 9;
      min-width: 0;
    }

    #player {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #player:not(.is-playing) {
      visibility: hidden;
    }

    #player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    #play-video {
      position: absolute;
      inset: 0;
      margin: auto;
      width: max-content;
      height: max-content;
      padding: .5em 1em;
      font: inherit;
    }

    #video-title[hidden], #status[hidden], #play-video[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <header class="title-band">
    <h1 id="video-title" hidden></h1>
  </header>
  <main class="video-stage">
    <div id="player"></div>
    <div id="status" role="status" hidden></div>
    <button type="button" id="play-video" hidden>Reproduzir vídeo</button>
  </main>
  <script src="video-player.js?v=3"></script>
</body>
</html>
