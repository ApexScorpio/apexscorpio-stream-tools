<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Stream Tools — Video Player</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#eee;font:16px system-ui}#player,iframe{width:100%;height:100%;border:0}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;pointer-events:none}#player{pointer-events:none}#player:not(.is-playing){visibility:hidden}
#video-title{position:absolute;top:clamp(8px,3vh,24px);left:clamp(8px,3vw,32px);right:clamp(8px,3vw,32px);width:fit-content;max-width:calc(100% - 2 * clamp(8px,3vw,32px));box-sizing:border-box;margin:0;padding:.35em .65em;background:rgba(0,0,0,.78);color:#fff;border-radius:4px;font-size:clamp(12px,3vw,22px);font-weight:600;overflow-wrap:anywhere;pointer-events:none}
#status[hidden],#play-video[hidden]{display:none}
#play-video{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:.5em 1em;font:inherit}</style></head><body><div id="player"></div><div id="video-title" hidden></div><div id="status" role="status" hidden></div><button type="button" id="play-video" hidden>Reproduzir vídeo</button><script src="video-player.js?v=3"></script></body></html>
